[package]
name = "rustdown-cli"
version = "0.1.3"
edition = "2024"
authors = ["Alex Spinu"]
description = "Render markdown/html/html-markdown in the terminal"
keywords = ["markdown", "terminal", "html", "cli"]
categories = ["command-line-utilities"]
documentation = "https://github.com/spinualexandru/rustdown#readme"
repository = "https://github.com/spinualexandru/rustdown"
homepage = "https://github.com/spinualexandru/rustdown"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rustdown"
path = "src/main.rs"

[lib]
name = "rustdown"
path = "src/lib.rs"

[dependencies]
termcolor = "1.4.1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
    "html",
    "simd",
] }
clap = { version = "4.6.7", features = ["derive"] }
html2md = "0.2.17"
html5ever = "0.39.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
terminal_size = "0.4.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
